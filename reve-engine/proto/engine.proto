syntax = "proto3";

package reve.engine.v1;

// Analysis result for one binary loaded by an analysis engine.
message Program {
  // Display name, usually the input file name.
  string name = 1;

  // Container format, for example "ELF".
  string format = 2;

  // Ghidra language identifier, for example "x86:LE:64:default".
  string architecture = 3;

  // Width of addresses in bits.
  uint32 address_size_bits = 4;

  // Functions recognized or imported by the analysis engine.
  repeated Function functions = 5;

  // Ascending addresses of the user's bookmarks: Ghidra's Note bookmarks, not
  // the ones its analysis adds.
  repeated uint64 bookmarks = 6;
}

// A function recognized by the analysis engine.
message Function {
  string name = 1;

  // Virtual address of the function entry point, not a file offset.
  uint64 entry = 2;

  // Function body size in bytes when known.
  uint64 size = 3;

  repeated Instruction instructions = 4;

  // Optional decompiler result. May be absent when reading an older export
  // that predates decompilation support.
  Decompilation decompilation = 5;
}

// C-like pseudocode produced by the engine's decompiler for one function.
message Decompilation {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    FAILED = 2;
    TIMED_OUT = 3;
    NOT_ATTEMPTED = 4;
  }

  Status status = 1;

  // Decompiled function signature, when available.
  string signature = 2;

  // C-like pseudocode. Empty when decompilation did not succeed.
  string c_code = 3;

  // Diagnostic supplied by the decompiler when it failed or timed out.
  optional string error_message = 4;

  // The same pseudocode as Ghidra's markup, one entry per line. Empty when
  // decompilation did not succeed.
  repeated Line lines = 5;
}

// One line of decompiled C.
message Line {
  // The line's text in order, indentation first.
  repeated Token tokens = 1;

  // Ascending addresses of the instructions this line's tokens came from.
  repeated uint64 addresses = 2;
}

// A run of decompiled C and the syntax class Ghidra gives it.
message Token {
  enum Kind {
    PLAIN = 0;
    KEYWORD = 1;
    COMMENT = 2;
    TYPE = 3;
    FUNCTION = 4;
    VARIABLE = 5;
    CONSTANT = 6;
    PARAMETER = 7;
    GLOBAL = 8;
    ERROR = 9;
    SPECIAL = 10;
  }

  string text = 1;
  Kind kind = 2;
}

// A decoded machine instruction.
message Instruction {
  // Virtual address in the program's address space, not a file offset.
  uint64 address = 1;

  uint32 size = 2;
  string mnemonic = 3;

  // Human-readable operand rendering; exact text can vary by language.
  string operands = 4;

  // Original instruction bytes.
  bytes bytes = 5;

  // End-of-line comment, when the instruction has one.
  optional string comment = 6;
}

// A change rêve asks Ghidra to make to the program it keeps open.
message Edit {
  oneof kind {
    Rename rename = 1;
    Comment comment = 2;
    Bookmark bookmark = 3;
  }
}

// Names the function at `entry`. An empty name restores Ghidra's default.
message Rename {
  uint64 entry = 1;
  string name = 2;
}

// The end-of-line comment at an instruction. Empty text means none.
message Comment {
  uint64 address = 1;
  string text = 2;
}

// Whether the user's bookmark is at an address.
message Bookmark {
  uint64 address = 1;
  bool on = 2;
}

// What an edit changed, or why Ghidra refused it.
message Changes {
  // Ghidra's reason for refusing the edit. Nothing changed when it is set.
  optional string error = 1;

  // Functions whose name or decompiled C changed: name, entry and
  // decompilation only.
  repeated Function functions = 2;

  repeated Comment comments = 3;
  repeated Bookmark bookmarks = 4;
}
