name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: runner.os == 'Linux'
        working-directory: reve-engine/ghidra-adapter/ghidra-extension
        run: |
          javac -d "$RUNNER_TEMP/decompiler-pool" ghidra_scripts/DecompilerPool.java developer_scripts/DecompilerPoolTest.java
          java -cp "$RUNNER_TEMP/decompiler-pool" DecompilerPoolTest
